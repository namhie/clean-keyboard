name: CleanKeyboard
options:
  bundleIdPrefix: com.roman
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CleanKeyboard:
    type: application
    platform: macOS
    sources:
      - path: CleanKeyboard
    settings:
      base:
        PRODUCT_NAME: "Clean Keyboard"
        PRODUCT_BUNDLE_IDENTIFIER: com.roman.CleanKeyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Clean Keyboard"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Roman"
        CODE_SIGN_ENTITLEMENTS: CleanKeyboard/Resources/CleanKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # Впиши свой Team ID (Xcode → Settings → Accounts), чтобы разрешение
        # «Универсальный доступ» не сбрасывалось после каждой пересборки.
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # Отдельный идентификатор, чтобы macOS не путала разрешения
        # тестовой сборки и установленной копии в «Программах».
        Debug:
          PRODUCT_NAME: "Clean Keyboard Dev"
          PRODUCT_BUNDLE_IDENTIFIER: com.roman.CleanKeyboard.debug
